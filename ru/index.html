<style>
  :root {
    --bg: #0f1116;
    --panel: #171a22;
    --panel-2: #1e222c;
    --line: #2a2f3b;
    --text: #e8eaf0;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --accent-2: #7cf3c0;
    --good: #3fbf7f;
    --warn: #e0a33a;
    --bad: #8b93a3;
    --radius: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(1200px 600px at 15% -10%, #1b2130 0%, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    padding: 28px 24px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(15, 17, 22, .72);
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .wrap { max-width: 1280px; margin: 0 auto; }

  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 13px; }
  .sub b { color: var(--text); font-weight: 600; }

  .langs { display: inline-flex; gap: 4px; margin-left: 10px; vertical-align: middle; }
  .langs button {
    padding: 2px 7px; font-size: 11.5px; font-weight: 600; letter-spacing: .03em;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; cursor: pointer;
  }
  .langs button:hover { color: var(--text); border-color: #3a4152; }
  .langs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }

  /* --- Зона загрузки файла --- */
  #dropzone {
    border: 2px dashed var(--line);
    border-radius: 16px;
    padding: 44px 24px;
    text-align: center;
    background: var(--panel);
    transition: border-color .15s, background .15s, transform .15s;
    cursor: pointer;
  }
  #dropzone.drag { border-color: var(--accent); background: #1b2233; transform: scale(1.005); }
  #dropzone .big { font-size: 17px; margin-bottom: 6px; }
  #dropzone .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
  #dropzone code {
    background: var(--panel-2); border: 1px solid var(--line);
    padding: 2px 6px; border-radius: 6px; font-size: 12.5px;
  }

  button, select, input[type="search"], input[type="text"] {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 11px;
    outline: none;
  }
  button { cursor: pointer; transition: border-color .15s, background .15s; }
  button:hover { border-color: #3a4152; background: #232836; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: #3f7cf0; }
  input[type="search"]:focus, input[type="text"]:focus, select:focus { border-color: var(--accent); }

  .btnrow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

  /* --- Панель управления --- */
  #toolbar { display: none; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  #toolbar.on { display: flex; }
  #toolbar .grow { flex: 1 1 240px; min-width: 200px; }
  #toolbar label { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  #filename { color: var(--muted); font-size: 12.5px; margin-left: auto; }

  /* --- Сводка --- */
  #stats { display: none; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 18px; }
  #stats.on { display: grid; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .stat .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-size: 21px; font-weight: 700; margin-top: 3px; }

  /* --- Каталог --- */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 15px 16px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: #3a4152; transform: translateY(-1px); }
  .card h2 { margin: 0; font-size: 16.5px; line-height: 1.3; }
  .card .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .rating { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 14px; }
  .rating .star { font-size: 13px; }
  .rating.good { color: var(--good); }
  .rating.mid { color: var(--warn); }
  .rating.low { color: var(--bad); }
  .reviews { color: var(--muted); font-size: 13px; }

  .chip {
    background: var(--panel-2); border: 1px solid var(--line);
    color: var(--muted); font-size: 12px; padding: 2px 8px; border-radius: 999px;
  }
  .chip.es { color: #ffd9a0; border-color: #6a4a20; background: #2a2114; cursor: help; }

  .addr { color: var(--muted); font-size: 13.5px; }

  .hours { font-size: 13px; color: var(--muted); }
  .hours-status { display: inline-block; }
  .hours-status.open { color: var(--good); }
  .hours details { margin-top: 4px; }
  .hours summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
  .hours .schedule { margin: 6px 0 0; padding-left: 2px; }
  .hours .schedule div { padding: 1px 0; color: var(--muted); }
  .hours .schedule b { color: var(--text); font-weight: 600; }
  .links { display: flex; gap: 12px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; font-size: 13.5px; }
  .links a { white-space: nowrap; }

  #empty { display: none; text-align: center; color: var(--muted); padding: 40px 0; }
  #empty.on { display: block; }
  #error { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 10px;
           background: #2a1b1b; border: 1px solid #5a2a2a; color: #ffb3b3; font-size: 13.5px; }
  #error.on { display: block; }

  #notice {
    display: none; align-items: center; gap: 10px; flex-wrap: wrap;
    margin-bottom: 14px; padding: 10px 14px; border-radius: 10px;
    background: #16241f; border: 1px solid #23503f; color: #b9f0d5; font-size: 13.5px;
  }
  #notice.on { display: flex; }
  #notice .spacer { flex: 1 1 auto; }
  #notice button { background: #1b2c26; border-color: #2c5a48; color: #cdf5e4; padding: 6px 10px; }
  #notice button:hover { background: #21382f; }
  footer { color: var(--muted); font-size: 12.5px; text-align: center; padding: 0 24px 40px; }

  /* Дни недели: принимаем русские и английские названия, отдаём на нужном языке */

    "monday": { ru: "понедельник", en: "Monday", es: "lunes" },

  const SHORT_DAYS = {

    "ср": { ru: "ср", en: "Wed", es: "mié" }, "чт": { ru: "чт", en: "Thu", es: "jue" },
    "пт": { ru: "пт", en: "Fri", es: "vie" }, "сб": { ru: "сб", en: "Sat", es: "sáb" },

  /* Фразы внутри расписания и статуса часов работы */
  const HOURS_PHRASES = {
    "24 часа в сутки": { ru: "24 часа в сутки", en: "Open 24 hours", es: "Abierto 24 horas" },
    "круглосуточно": { ru: "Круглосуточно", en: "Open 24 hours", es: "Abierto 24 horas" },

  /* Фразы со временем: «Закроется в 18:00», «Closes at 6 PM» */
  const HOURS_PATTERNS = [
    [/Закроется в\s*([\d:]+)/gi, "Закроется в $1", "Closes at $1", "Cierra a las $1"],
    [/Откроется в\s*([\d:]+)/gi, "Откроется в $1", "Opens at $1", "Abre a las $1"],
    [/Закрывается в\s*([\d:]+)/gi, "Закрывается в $1", "Closes at $1", "Cierra a las $1"],
    [/Открывается в\s*([\d:]+)/gi, "Открывается в $1", "Opens at $1", "Abre a las $1"],
    [/Closes at\s*([\d:]+|\d{1,2}\s*(?:am|pm))/gi, "Закроется в $1", "Closes at $1", "Cierra a las $1"],
    [/Opens at\s*([\d:]+|\d{1,2}\s*(?:am|pm))/gi, "Откроется в $1", "Opens at $1", "Abre a las $1"],
    [/Closes\s+(\d{1,2}\s*(?:am|pm))/gi, "Закроется в $1", "Closes at $1", "Cierra a las $1"],
    [/Opens\s+(\d{1,2}\s*(?:am|pm))/gi, "Откроется в $1", "Opens at $1", "Abre a las $1"],
  ];

  /* Страны, регионы и города, которые источники отдают по-русски */
  const PLACES_I18N = {
    "соединенные штаты": { ru: "Соединенные Штаты", en: "United States", es: "Estados Unidos" },
    "соединённые штаты": { ru: "Соединенные Штаты", en: "United States", es: "Estados Unidos" },
    "соединенные штаты америки": { ru: "Соединенные Штаты", en: "United States", es: "Estados Unidos" },
    "united states": { ru: "Соединенные Штаты", en: "United States", es: "Estados Unidos" },
    "респ. татарстан": { ru: "Респ. Татарстан", en: "Republic of Tatarstan", es: "República de Tartaristán" },
    "республика татарстан": { ru: "Респ. Татарстан", en: "Republic of Tatarstan", es: "República de Tartaristán" },
    "россия": { ru: "Россия", en: "Russia", es: "Rusia" },
    "russia": { ru: "Россия", en: "Russia", es: "Rusia" },
    "казань": { ru: "Казань", en: "Kazan", es: "Kazán" },
    "kazan": { ru: "Казань", en: "Kazan", es: "Kazán" },
    "москва": { ru: "Москва", en: "Moscow", es: "Moscú" },
    "moscow": { ru: "Москва", en: "Moscow", es: "Moscú" },
    "даллас": { ru: "Даллас", en: "Dallas", es: "Dallas" },
    "dallas": { ru: "Даллас", en: "Dallas", es: "Dallas" },
    "денвер": { ru: "Денвер", en: "Denver", es: "Denver" },
    "denver": { ru: "Денвер", en: "Denver", es: "Denver" },
  };

  /* Часы работы и статус на нужном языке */
  function localizeHoursText(text) {
    if (!text) return text;
    let out = String(text);
    for (const [pattern, ru, en, es] of HOURS_PATTERNS) {
      out = out.replace(pattern, LANG === "ru" ? ru : (LANG === "es" ? es : en));
    }
    for (const [key, forms] of Object.entries(WEEKDAYS)) {
      out = out.replace(new RegExp("(^|\\s|;)" + key + "(?=:|\\s)", "gi"),
        (match, before) => before + (forms[LANG] || forms.en));
    }
    for (const [key, forms] of Object.entries(SHORT_DAYS)) {
      out = out.replace(new RegExp("\\(" + key + "\\)", "gi"), "(" + (forms[LANG] || forms.en) + ")");
    }
    for (const [key, forms] of Object.entries(HOURS_PHRASES)) {
      out = out.replace(new RegExp(key, "gi"), forms[LANG] || forms.en);
    }
    return out;
  }

  function localizeSchedule(text) {
    if (!text) return "";
    return String(text).split(/;\s*/).map((slot) => {
      const index = slot.indexOf(":");
      if (index < 0) return localizeHoursText(slot.trim());
      const day = slot.slice(0, index).trim();
      const rest = slot.slice(index + 1).trim();
      const forms = WEEKDAYS[day.toLowerCase()];
      return (forms ? (forms[LANG] || forms.en) : day) + ": " + localizeHoursText(rest);
    }).join("; ");
  }

  function localizePlace(value) {
    if (!value) return "";
    const forms = PLACES_I18N[String(value).trim().toLowerCase()];
    return forms ? (forms[LANG] || forms.en) : value;
  }

  function localizeAddress(text) {
    if (!text) return "";
    return String(text).split(",").map((segment) => {
      const trimmed = segment.trim();
      const forms = PLACES_I18N[trimmed.toLowerCase()];
      return forms ? (forms[LANG] || forms.en) : trimmed;
    }).join(", ");
  }

  /* Служебный текст Google, который мог попасть в статус до правки парсера */
  const STATUS_NOISE = /(?:Обновлено компанией|Updated by (?:the )?business|Actualizado por la empresa)[^·|]*/gi;

  function localizeStatus(text) {
    if (!text) return "";
    return localizeHoursText(String(text)).replace(STATUS_NOISE, "").replace(/\s*·\s*$/, "").trim();
  }

  const SUPPORTED = ["ru", "en", "es"];

  function detectLanguage() {
    // 1) язык, проставленный при публикации (/ru/, /en/, /es/)
    const fromHtml = (document.documentElement.lang || "").toLowerCase().slice(0, 2);
    if (SUPPORTED.includes(fromHtml)) return fromHtml;
    // 2) язык из адреса
    const fromPath = (location.pathname.match(/\/(ru|en|es)(\/|$)/) || [])[1];
    if (fromPath) return fromPath;
    // 3) выбор пользователя, 4) язык браузера
    try {
      const saved = localStorage.getItem("catalog-lang");
      if (SUPPORTED.includes(saved)) return saved;
    } catch (err) { /* приватный режим */ }
    const fromBrowser = (navigator.language || "en").toLowerCase().slice(0, 2);
    return SUPPORTED.includes(fromBrowser) ? fromBrowser : "en";
  }

  let LANG = detectLanguage();

  function t(key) {
    const dict = I18N[LANG] || I18N.en;
    return dict[key] !== undefined ? dict[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  }

  // Склонение по правилам языка: ru — три формы, en/es — две
  function pluralBy(count, forms) {
    const n = Math.abs(count);
    if (forms.length === 2) return n === 1 ? forms[0] : forms[1];
    const tail100 = n % 100, tail10 = n % 10;
    if (tail100 >= 11 && tail100 <= 14) return forms[2];
    if (tail10 === 1) return forms[0];
    if (tail10 >= 2 && tail10 <= 4) return forms[1];
    return forms[2];
  }

  const recordsWord = (count) => pluralBy(count, t("records"));
  const reviewsWord = (count) => pluralBy(count, t("reviewsWord"));

  function categoryLabel(value) {
    if (!value) return "";
    const key = String(value).trim().toLowerCase();
    const found = CATEGORY_I18N[key];
    return found ? (found[LANG] || found.en || value) : value;
  }

  /* ------------------------------------------------------------------ */
  /* Состояние                                                           */
  /* ------------------------------------------------------------------ */
  const state = { rows: [], filtered: [], fileName: "" };

  const $ = (id) => document.getElementById(id);
  const el = {
    toolbar: $("toolbar"), grid: $("grid"), empty: $("empty"), error: $("error"),
    q: $("q"), city: $("city"), category: $("category"), minRating: $("minRating"),
    sort: $("sort"), lang: $("lang"),
    langs: $("langs"),
    subtitle: $("subtitle"),
    emptyReset: $("emptyReset"),
  };

  /* Настройки вида (язык и фильтры) — в localStorage */
  const LS_FILTERS = "maps-catalog/filters";
  const store = {
    saveFilters(filters) {
      try { localStorage.setItem(LS_FILTERS, JSON.stringify(filters)); } catch (err) { /* приватный режим */ }
    },
    loadFilters() {
      try {
        const raw = localStorage.getItem(LS_FILTERS);
        return raw ? JSON.parse(raw) : null;
      } catch (err) { return null; }
    },
  };

  function currentFilters() {
    return { q: el.q.value, city: el.city.value, category: el.category.value,
             minRating: el.minRating.value, sort: el.sort.value, lang: el.lang.value };
  }

  /* ------------------------------------------------------------------ */
  /* Нормализация записей из JSON                                        */
  /* ------------------------------------------------------------------ */
  const NA = new Set(["", "н/д", "n/a", "na", "none", "null", "undefined", "-"]);

  function pick(obj, keys) {
    for (const key of keys) {
      if (obj[key] !== undefined && obj[key] !== null) {
        const value = String(obj[key]).trim();
        if (value && !NA.has(value.toLowerCase())) return value;
      }
    }
    return "";
  }

  function num(value) {
    if (value === undefined || value === null) return null;
    const n = parseFloat(String(value).replace(",", ".").replace(/\s/g, ""));
    return Number.isFinite(n) ? n : null;
  }

  function normalize(raw) {
    if (!raw || typeof raw !== "object") return null;
    const name = pick(raw, ["name", "title", "Название", "название"]);
    const address = pick(raw, ["address", "addr", "Адрес", "адрес"]);
    const category = pick(raw, ["category", "type", "Категория", "категория"]);
    const website = pick(raw, ["website", "site", "url_site", "Сайт", "сайт"]);
    const mapsUrl = pick(raw, ["url", "maps_url", "link", "Ссылка", "ссылка"]);
    const info = pick(raw, ["info", "raw"]);
    const hours = pick(raw, ["hours", "opening_hours", "schedule", "Часы работы", "часы работы"]);
    const hoursStatus = pick(raw, ["hours_status", "hours_now", "open_now", "Статус часов"]);
    const spanishRaw = raw.lang_es ?? raw.spanish ?? raw.испанский ?? 0;
    const spanish = spanishRaw === true || spanishRaw === 1 || String(spanishRaw).toLowerCase() === "да";
    const spanishEvidence = pick(raw, ["lang_es_evidence", "spanish_evidence", "Обоснование языка"]);
    const spanishSources = pick(raw, ["lang_es_sources", "spanish_sources"]);
    let reviews = num(pick(raw, ["reviews", "review_count", "reviews_count", "Отзывы", "отзывы"]));
    let rating = num(pick(raw, ["rating", "stars", "Рейтинг", "рейтинг"]));

    // Если rating/reviews не разобрались, пробуем вытащить их из строки info.
    if ((rating === null || reviews === null) && info) {
      if (rating === null) {
        const m = info.match(/(\d[.,]\d)/);
        if (m) rating = num(m[1]);
      }
      if (reviews === null) {
        const m = info.match(/\(([\d\s\u00a0.,]+)\)/) || info.match(/([\d\s\u00a0.,]{1,12})\s*(?:reviews?|отзыв)/i);
        if (m) reviews = num(m[1].replace(/[^\d]/g, ""));
      }
    }

    if (!name && !address && !mapsUrl) return null;

    return {
      name: name || "(no name)",
      rating,
      reviews,
      category,
      address: address || (info && /[a-zA-Zа-яА-Я]/.test(info) ? info : ""),
      phone: pick(raw, ["phone", "tel", "Телефон", "телефон"]),
      website,
      hours,
      hoursStatus,
      spanish,
      spanishEvidence,
      spanishSources,
      // Сильный признак: атрибут заведения или отзывы на испанском.
      spanishStrong: /attr|reviews/.test(spanishSources),
      url: mapsUrl,
      city: pick(raw, ["city", "Город", "город"]),
      query: pick(raw, ["query", "Запрос", "запрос"]),
    };
  }

  function extractRows(parsed) {
    let list = parsed;
    if (!Array.isArray(list)) {
      for (const key of ["results", "data", "items", "places", "rows"]) {
        if (Array.isArray(parsed && parsed[key])) { list = parsed[key]; break; }
      }
    }
    if (!Array.isArray(list)) throw new Error(t("errNoArray"));
    return list.map(normalize).filter(Boolean);
  }

  /* ------------------------------------------------------------------ */
  /* Загрузка                                                            */
  /* ------------------------------------------------------------------ */
  function showError(message) {
    el.error.textContent = message;
    el.error.classList.add("on");
  }
  function clearError() { el.error.classList.remove("on"); el.error.textContent = ""; }

  /* Русские склонения: 1 запись, 2 записи, 11 записей. */
  function plural(count, forms) {
    const n = Math.abs(Math.trunc(count));
    const tail100 = n % 100;
    const tail10 = n % 10;
    if (tail100 >= 11 && tail100 <= 14) return forms[2];
    if (tail10 === 1) return forms[0];
    if (tail10 >= 2 && tail10 <= 4) return forms[1];
    return forms[2];
  }

  function relativeTime(timestamp) {
    const seconds = Math.max(0, Math.round((Date.now() - timestamp) / 1000));
    if (seconds < 60) return t("justNow");
    const minutes = Math.round(seconds / 60);
    if (minutes < 60) return minutes + " " + t("minAgo");
    const hours = Math.round(minutes / 60);
    if (hours < 24) return hours + " " + t("hourAgo");
    return new Date(timestamp).toLocaleString(LANG === "ru" ? "ru-RU" : LANG);
  }

  /* Применяет выбранный язык ко всему интерфейсу и перерисовывает каталог */
  function applyLanguage() {
    document.documentElement.lang = LANG;
    document.title = t("docTitle");
    document.querySelectorAll("[data-i18n]").forEach((node) => {
      node.textContent = t(node.dataset.i18n);
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach((node) => {
      node.placeholder = t(node.dataset.i18nPlaceholder);
    });
    document.querySelectorAll("#langs button").forEach((button) => {
      button.classList.toggle("active", button.dataset.lang === LANG);
      button.title = (I18N[button.dataset.lang] || {}).langName || button.dataset.lang;
    });
    document.querySelectorAll("[data-i18n-title]").forEach((node) => {
      node.title = t(node.dataset.i18nTitle);
    });
    buildCityOptions();
    buildCategoryOptions();
    applyFilters();
  }

  /* Переключение языка: на опубликованном сайте — переход на адрес языка,
     локально (один файл) — мгновенная смена без перезагрузки */
  function switchLanguage(next) {
    if (!SUPPORTED.includes(next) || next === LANG) return;
    LANG = next;
    try { localStorage.setItem("catalog-lang", next); } catch (err) { /* приватный режим */ }
    const match = location.pathname.match(/\/(ru|en|es)(\/|$)/);
    if (match) {
      location.href = location.pathname.replace(/\/(ru|en|es)(\/|$)/, "/" + next + "$2")
        + location.search + location.hash;
      return;
    }
    applyLanguage();
  }

  const langButtons = document.querySelectorAll("#langs button");
  langButtons.forEach((button) => {
    button.addEventListener("click", () => switchLanguage(button.dataset.lang));
  });

  /* Отрисовка уже готового набора записей (после загрузки файла или восстановления). */
  function applyData(rows, fileName) {
    state.rows = rows;
    state.fileName = fileName || "данные";
    el.toolbar.classList.add("on");
    buildCityOptions();
    buildCategoryOptions();

    const sources = new Set(rows.map((r) => [r.query, r.city].filter(Boolean).join(" · ")).filter(Boolean));
    el.subtitle.textContent = "";
    el.subtitle.append(document.createTextNode(t("subtitle")), el.langs);
  }

  function applyRows(rows, sourceName) {
    if (!rows.length) { showError(t("errNoRows")); return false; }
    clearError();
    applyData(rows, sourceName);
    applyFilters();
    return true;
  }

  /* ------------------------------------------------------------------ */
  /* Фильтры, сортировка, отрисовка                                      */
  /* ------------------------------------------------------------------ */
  function buildCityOptions() {
    const cities = [...new Set(state.rows.map((row) => row.city).filter(Boolean))]
      .sort((a, b) => a.localeCompare(b, LANG));
    const previous = el.city.value;
    el.city.textContent = "";
    const all = document.createElement("option");
    all.value = ""; all.textContent = t("allCities");
    el.city.append(all);
    for (const value of cities) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = localizePlace(value);
      el.city.append(option);
    }
    if ([...el.city.options].some((option) => option.value === previous)) {
      el.city.value = previous;
    }
  }

  function buildCategoryOptions() {
    const categories = [...new Set(state.rows.map((r) => r.category).filter(Boolean))]
      .sort((a, b) => categoryLabel(a).localeCompare(categoryLabel(b), LANG));
    const previous = el.category.value;
    el.category.textContent = "";
    const all = document.createElement("option");
    all.value = ""; all.textContent = t("all") + " (" + state.rows.length + ")";
    el.category.append(all);
    for (const c of categories) {
      const option = document.createElement("option");
      option.value = c; option.textContent = categoryLabel(c);
      el.category.append(option);
    }
    if ([...el.category.options].some((option) => option.value === previous)) {
      el.category.value = previous;
    }
  }

  function applyFilters() {
    const needle = el.q.value.trim().toLowerCase();
    const category = el.category.value;
    const city = el.city.value;
    const minRating = parseFloat(el.minRating.value) || 0;
    const lang = el.lang.value;

    state.filtered = state.rows.filter((row) => {
      if (city && row.city !== city) return false;
      if (category && row.category !== category) return false;
      if (minRating && (row.rating === null || row.rating < minRating)) return false;
      if (lang === "es" && !row.spanish) return false;
      if (lang === "es-strong" && !row.spanishStrong) return false;
      if (lang === "es-no" && row.spanish) return false;
      if (!needle) return true;
      // «query» в поиск не включаем: он одинаков у всех строк одного парсинга.
      const haystack = [row.name, row.category, row.website, row.phone, row.city,
                        localizeAddress(row.address), categoryLabel(row.category),
                        row.hours, row.hoursStatus, localizeStatus(row.hoursStatus)]
        .filter(Boolean).join(" ").toLowerCase();
      return needle.split(/\s+/).every((token) => haystack.includes(token));
    });

    const sortKey = el.sort.value;
    const collator = new Intl.Collator("ru");
    state.filtered.sort((a, b) => {
      if (sortKey === "reviews") return (b.reviews || 0) - (a.reviews || 0) || collator.compare(a.name, b.name);
      if (sortKey === "name") return collator.compare(a.name, b.name);
      if (sortKey === "address") return collator.compare(a.address || "", b.address || "");
      // по умолчанию: рейтинг ↓, затем отзывы ↓
      return (b.rating || 0) - (a.rating || 0) || (b.reviews || 0) - (a.reviews || 0);
    });

    renderStats();
    renderGrid();
  }

  function renderStats() {
    // Публичный сайт: показываем пользователю только количество найденного
    el.empty.classList.toggle("on", state.filtered.length === 0);
  }

  function ratingClass(rating) {
    if (rating === null) return "low";
    if (rating >= 4.5) return "good";
    if (rating >= 4.0) return "mid";
    return "low";
  }

  function link(href, text, extra) {
    const a = document.createElement("a");
    a.href = href;
    a.textContent = text;
    a.rel = "noopener noreferrer";
    a.target = "_blank";
    if (extra) a.title = extra;
    return a;
  }

  function card(row) {
    const article = document.createElement("article");
    article.className = "card";

    const h2 = document.createElement("h2");
    h2.textContent = row.name;
    article.append(h2);

    const row1 = document.createElement("div");
    row1.className = "row";
    if (row.rating !== null) {
      const rating = document.createElement("span");
      rating.className = "rating " + ratingClass(row.rating);
      const star = document.createElement("span");
      star.className = "star"; star.textContent = "★";
      rating.append(star, document.createTextNode(row.rating.toFixed(1)));
      row1.append(rating);
    }
    if (row.reviews !== null) {
      const reviews = document.createElement("span");
      reviews.className = "reviews";
      reviews.textContent = row.reviews.toLocaleString(LANG === "ru" ? "ru-RU" : LANG) + " " +
        reviewsWord(row.reviews);
      row1.append(reviews);
    }
    if (row.category) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = categoryLabel(row.category);
      row1.append(chip);
    }
    if (row1.childNodes.length) article.append(row1);

    if (row.address) {
      const address = document.createElement("div");
      address.className = "addr";
      // Город добавляем к адресу, если в самом адресе его нет
      const shownCity = row.city ? localizePlace(row.city) : "";
      const addressHasCity = shownCity &&
        localizeAddress(row.address).toLowerCase().includes(shownCity.toLowerCase());
      address.textContent = "📍 " + localizeAddress(row.address) +
        (shownCity && !addressHasCity ? ", " + shownCity : "");
      article.append(address);
    } else if (row.city) {
      const address = document.createElement("div");
      address.className = "addr";
      address.textContent = "📍 " + localizePlace(row.city);
      article.append(address);
    }

    // Часы работы: состояние («Открыто · Закроется в 20:00») и расписание по дням.
    if (row.hoursStatus || row.hours) {
      const hours = document.createElement("div");
      hours.className = "hours";
      if (row.hoursStatus) {
        const status = document.createElement("span");
        const statusText = localizeStatus(row.hoursStatus);
        // «открыто» на любом языке: ru Открыто/Abierto, en Open, es Abierto
        status.className = "hours-status" +
          (/открыто|abierto|open\b/i.test(statusText) ? " open" : "");
        status.textContent = "🕒 " + statusText;
        hours.append(status);
      }
      if (row.hours) {
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = t("schedule");
        const schedule = document.createElement("div");
        schedule.className = "schedule";
        // «вторник: 09:00–20:00; среда: …» → по строке на день
        for (const slot of String(row.hours).split(/\s*;\s*/)) {
          if (!slot.trim()) continue;
          const line = document.createElement("div");
          const [day, ...rest] = slot.split(":");
          const dayEl = document.createElement("b");
          const forms = WEEKDAYS[day.trim().toLowerCase()];
          dayEl.textContent = (forms ? (forms[LANG] || forms.en) : day.trim()) + ": ";
          line.append(dayEl, document.createTextNode(localizeHoursText(rest.join(":").trim())));
          schedule.append(line);
        }
        details.append(summary, schedule);
        hours.append(details);
      }
      article.append(hours);
    }

    // Признаки испанского языка: чип с расшифровкой в подсказке.
    if (row.spanish) {
      const spanish = document.createElement("div");
      spanish.className = "lang";
      const badge = document.createElement("span");
      badge.className = "chip es";
      badge.textContent = row.spanishStrong ? t("spanishYes") : t("spanishMaybe");
      if (row.spanishEvidence) badge.title = row.spanishEvidence;
      spanish.append(badge);
      article.append(spanish);
    }

    const links = document.createElement("div");
    links.className = "links";
    if (row.phone) links.append(link("tel:" + row.phone.replace(/[^\d+]/g, ""), "☎ " + row.phone));
    if (row.website) {
      const href = /^https?:\/\//i.test(row.website) ? row.website : "https://" + row.website;
      links.append(link(href, "🌐 " + row.website.replace(/^https?:\/\//i, "")));
    }
    if (row.url) links.append(link(row.url, "🗺 Google Maps"));
    if (links.childNodes.length) article.append(links);

    return article;
  }

  function renderGrid() {
    const fragment = document.createDocumentFragment();
    for (const row of state.filtered) fragment.append(card(row));
    el.grid.textContent = "";
    el.grid.append(fragment);
    el.empty.classList.toggle("on", state.filtered.length === 0);
  }

  let filtersSaveTimer = null;
  ["input", "change"].forEach((evt) => {
    el.q.addEventListener(evt, applyFilters);
    el.city.addEventListener(evt, applyFilters);
    el.category.addEventListener(evt, applyFilters);
    el.minRating.addEventListener(evt, applyFilters);
    el.sort.addEventListener(evt, applyFilters);
    el.lang.addEventListener(evt, applyFilters);
  });
  // Настройки вида сохраняем отдельно от данных и не на каждое нажатие клавиши.
  ["input", "change"].forEach((evt) => {
    [el.q, el.city, el.category, el.minRating, el.sort, el.lang].forEach((control) =>
      control.addEventListener(evt, () => {
        clearTimeout(filtersSaveTimer);
        filtersSaveTimer = setTimeout(() => store.saveFilters(currentFilters()), 400);
      }));
  });

  /* ------------------------------------------------------------------ */
  /* Старт: данные из salons.data.js → сохранённая копия → salons.json по http */
  /* ------------------------------------------------------------------ */
  const bundledData = () => {
    const payload = window.__CATALOG_DATA__;
    if (!payload) return null;
    const raw = Array.isArray(payload) ? payload : payload.rows;
    if (!Array.isArray(raw) || !raw.length) return null;
    const rows = raw.map(normalize).filter(Boolean);
    if (!rows.length) return null;
    return {
      rows,
      source: (payload && payload.source) ? String(payload.source) : "salons.data.js",
      generatedAt: (payload && payload.generatedAt) ? Date.parse(payload.generatedAt) || null : null,
    };
  };

  function restoreFilters() {
    const saved = store.loadFilters();
    if (!saved) return;
    if (typeof saved.q === "string") el.q.value = saved.q;
    if (typeof saved.minRating === "string") el.minRating.value = saved.minRating;
    if (typeof saved.sort === "string") el.sort.value = saved.sort;
    if (typeof saved.lang === "string") el.lang.value = saved.lang;
    if (typeof saved.city === "string") el.city.value = saved.city;
    if (typeof saved.category === "string" &&
        [...el.category.options].some((option) => option.value === saved.category)) {
      el.category.value = saved.category;
    }
  }

  applyLanguage();

  (async () => {
    const bundled = bundledData();
    if (bundled) {
      applyRows(bundled.rows, bundled.source);
      restoreFilters();
      applyFilters();
      return;
    }
    // Запасной путь: страница отдана по http, берём данные из salons.json
    try {
      const res = await fetch("../salons.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      applyRows(extractRows(await res.json()), "salons.json");
      restoreFilters();
      applyFilters();
    } catch (err) {
      showError(t("errNoData"));
    }
  })();
})();
</script>
</body>
</html>
