<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Business catalog — Google Maps</title>
<link rel="canonical" href="./en/">
<link rel="alternate" hreflang="ru" href="./ru/">
<link rel="alternate" hreflang="en" href="./en/">
<link rel="alternate" hreflang="es" href="./es/">
<link rel="alternate" hreflang="x-default" href="./en/">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/favicon-apple-touch-icon.png">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("catalog-lang"); } catch (e) {}
    var supported = ["ru", "en", "es"];
    var lang = supported.indexOf(saved) >= 0 ? saved : (navigator.language || "en").slice(0, 2).toLowerCase();
    if (supported.indexOf(lang) < 0) lang = "en";
    location.replace(lang + "/" + location.search + location.hash);
  })();
</script>
</head>
<body style="background:#0f1116;color:#e8eaf0;font:15px system-ui,sans-serif;padding:40px">
  <p>Choose a language:</p>
  <ul>
    <li><a style="color:#4f8cff" href="ru/">Каталог организаций — русский</a></li>
    <li><a style="color:#4f8cff" href="en/">Business catalog — English</a></li>
    <li><a style="color:#4f8cff" href="es/">Catálogo de negocios — español</a></li>
  </ul>
</body>
</html>
